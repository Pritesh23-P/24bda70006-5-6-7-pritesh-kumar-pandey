server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spring-boot-integrated-platform

  datasource:
    url: jdbc:h2:mem:platformdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  cache:
    type: caffeine
    cache-names:
      - posts
      - post-analytics
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

app:
  jwt:
    # 256-bit secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  security:
    # 256-bit AES encryption secret key
    aes-secret-key: SampleAesKeyForOAuthCredentials2026!
  cors:
    allowed-origins:
      - "http://localhost:8080"
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://127.0.0.1:8080"

logging:
  level:
    root: INFO
    com.example.platform: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
